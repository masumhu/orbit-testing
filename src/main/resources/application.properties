spring.application.name=orbit
spring.config.import=optional:file:.env[.properties]

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

server.port=${PORT:8080}
server.error.include-message=never

devhub.registration.otp-ttl=PT10M
devhub.registration.max-otp-attempts=5
devhub.registration.otp-hmac-secret=${OTP_HMAC_SECRET:}
devhub.registration.google-client-id=${GOOGLE_OAUTH_CLIENT_ID:}
devhub.registration.github-client-id=${GITHUB_OAUTH_CLIENT_ID:}
devhub.registration.github-client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
devhub.registration.github-redirect-uri=${GITHUB_OAUTH_REDIRECT_URI:http://localhost:3000/auth/github/callback}

devhub.security.jwt-secret=${JWT_SECRET:}
devhub.security.access-token-ttl=PT15M
devhub.security.refresh-token-ttl=P30D

spring.jackson.default-property-inclusion=non_null
springdoc.swagger-ui.path=/swagger-ui.html
devhub.websocket.allowed-origin-patterns=${DEVHUB_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*,capacitor://localhost}

